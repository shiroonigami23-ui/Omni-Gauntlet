name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  receiver:
    name: Receiver tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: receiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Gesture tour demo (dry run)
        run: omni-receiver simulate --demo-key --fast

  firmware-core:
    name: Firmware core unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/test

  firmware-build:
    name: Firmware build (ESP32, PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: omni-gauntlet-firmware
          path: firmware/.pio/build/esp32doit-devkit-v1/firmware.bin
